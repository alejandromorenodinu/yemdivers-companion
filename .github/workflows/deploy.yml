name: Deploy Angular a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de produccion
        run: npx ng build --configuration production --base-href=/yemdivers-companion/

      - name: Preparar salida y 404.html
        run: |
          OUT_DIR=$(dirname "$(find dist -name index.html | head -n 1)")
          echo "Carpeta de salida: $OUT_DIR"
          cp "$OUT_DIR/index.html" "$OUT_DIR/404.html"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4